
name: Build Dictate Wear OS Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Wear OS Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload Wear OS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dictate-WearOS-Debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
